<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js/nav-menu.js" async></script>
    <script src="js/description-page.js" defer></script>
    <title>Description - Finglyph</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/info-pages.css" />
</head>
<body class="description-page">
    <div class="container">
        <header class="top-fixed">
            <h1><a class="brand-link" href="main_page.html">Finglyph</a></h1>
            <nav class="top-right-buttons" aria-label="Main navigation">
                <a class="nav-btn how-to-use" href="howtouse.html">How to use</a>
                <a class="nav-btn behind" href="behind.html">Behind</a>
                <a class="nav-btn description" href="description.html" aria-current="page">Description</a>
                <span class="nav-indicator" aria-hidden="true"></span>
            </nav>
        </header>
        <main class="info-content">
            <ul class="sign-grid" aria-label="ASL alphabet hand signs">
                <li data-description="Straighten your four fingers, with your thumb up."><img class="sign-grid__hand" src="assets/signs/A.svg" alt="ASL hand sign for A" /><img class="sign-grid__letter" src="assets/handwriting/A.svg" alt="" /></li>
                <li data-description="Straighten your four fingers, with your thumb folden."><img class="sign-grid__hand" src="assets/signs/B.svg" alt="ASL hand sign for B" /><img class="sign-grid__letter" src="assets/handwriting/B.svg" alt="" /></li>
                <li data-description="Straighten your four fingers, also your thumb."><img class="sign-grid__hand" src="assets/signs/C.svg" alt="ASL hand sign for C" /><img class="sign-grid__letter" src="assets/handwriting/C.svg" alt="" /></li>
                <li data-description="Make sure to show your fingernails!"><img class="sign-grid__hand" src="assets/signs/D.svg" alt="ASL hand sign for D" /><img class="sign-grid__letter" src="assets/handwriting/D.svg" alt="" /></li>
                <li data-description="Curl all your fingers inward."><img class="sign-grid__hand" src="assets/signs/E.svg" alt="ASL hand sign for E" /><img class="sign-grid__letter" src="assets/handwriting/E.svg" alt="" /></li>
                <li data-description="Make an OK sign showing your fingernails."><img class="sign-grid__hand" src="assets/signs/F.svg" alt="ASL hand sign for F" /><img class="sign-grid__letter" src="assets/handwriting/F.svg" alt="" /></li>
                <li data-description="Point with your index finger."><img class="sign-grid__hand" src="assets/signs/G.svg" alt="ASL hand sign for G" /><img class="sign-grid__letter" src="assets/handwriting/G.svg" alt="" /></li>
                <li data-description="Point with your index finger and middle finger."><img class="sign-grid__hand" src="assets/signs/H.svg" alt="ASL hand sign for H" /><img class="sign-grid__letter" src="assets/handwriting/H.svg" alt="" /></li>
                <li data-description="Point out a pinky, show your palm side!"><img class="sign-grid__hand" src="assets/signs/I.svg" alt="ASL hand sign for I" /><img class="sign-grid__letter" src="assets/handwriting/I.svg" alt="" /></li>
                <li data-description="Point out a pinky, show your back side!"><img class="sign-grid__hand" src="assets/signs/J.svg" alt="ASL hand sign for J" /><img class="sign-grid__letter" src="assets/handwriting/J.svg" alt="" /></li>
                <li data-description="Thumb goes between your fingers!"><img class="sign-grid__hand" src="assets/signs/K.svg" alt="ASL hand sign for K" /><img class="sign-grid__letter" src="assets/handwriting/K.svg" alt="" /></li>
                <li data-description="Show your big Love."><img class="sign-grid__hand" src="assets/signs/L.svg" alt="ASL hand sign for L" /><img class="sign-grid__letter" src="assets/handwriting/L.svg" alt="" /></li>
                <li data-description="Thumb fits in before your pinky."><img class="sign-grid__hand" src="assets/signs/M.svg" alt="ASL hand sign for M" /><img class="sign-grid__letter" src="assets/handwriting/M.svg" alt="" /></li>
                <li data-description="Thumb fits in the middle."><img class="sign-grid__hand" src="assets/signs/N.svg" alt="ASL hand sign for N" /><img class="sign-grid__letter" src="assets/handwriting/N.svg" alt="" /></li>
                <li data-description="A big round circle."><img class="sign-grid__hand" src="assets/signs/O.svg" alt="ASL hand sign for O" /><img class="sign-grid__letter" src="assets/handwriting/O.svg" alt="" /></li>
                <li data-description="Try to grab something without your index."><img class="sign-grid__hand" src="assets/signs/P.svg" alt="ASL hand sign for P" /><img class="sign-grid__letter" src="assets/handwriting/P.svg" alt="" /></li>
                <li data-description="Try to grab only with your thumb and index."><img class="sign-grid__hand" src="assets/signs/Q.svg" alt="ASL hand sign for Q" /><img class="sign-grid__letter" src="assets/handwriting/Q.svg" alt="" /></li>
                <li data-description="Wish you a luck, don't lie!"><img class="sign-grid__hand" src="assets/signs/R.svg" alt="ASL hand sign for R" /><img class="sign-grid__letter" src="assets/handwriting/R.svg" alt="" /></li>
                <li data-description="Grab a fist with your thumb in the front."><img class="sign-grid__hand" src="assets/signs/S.svg" alt="ASL hand sign for S" /><img class="sign-grid__letter" src="assets/handwriting/S.svg" alt="" /></li>
                <li data-description="Make a T with your thumb and index crossed."><img class="sign-grid__hand" src="assets/signs/T.svg" alt="ASL hand sign for T" /><img class="sign-grid__letter" src="assets/handwriting/T.svg" alt="" /></li>
                <li data-description="Two straight fingers upward."><img class="sign-grid__hand" src="assets/signs/U.svg" alt="ASL hand sign for U" /><img class="sign-grid__letter" src="assets/handwriting/U.svg" alt="" /></li>
                <li data-description="Victory!"><img class="sign-grid__hand" src="assets/signs/V.svg" alt="ASL hand sign for V" /><img class="sign-grid__letter" src="assets/handwriting/V.svg" alt="" /></li>
                <li data-description="I would rather call it a double-V."><img class="sign-grid__hand" src="assets/signs/W.svg" alt="ASL hand sign for W" /><img class="sign-grid__letter" src="assets/handwriting/W.svg" alt="" /></li>
                <li data-description="Curl your index finger."><img class="sign-grid__hand" src="assets/signs/X.svg" alt="ASL hand sign for X" /><img class="sign-grid__letter" src="assets/handwriting/X.svg" alt="" /></li>
                <li data-description="Hang loose."><img class="sign-grid__hand" src="assets/signs/Y.svg" alt="ASL hand sign for Y" /><img class="sign-grid__letter" src="assets/handwriting/Y.svg" alt="" /></li>
                <li data-description="Point your index finger towards the corner."><img class="sign-grid__hand" src="assets/signs/Z.svg" alt="ASL hand sign for Z" /><img class="sign-grid__letter" src="assets/handwriting/Z.svg" alt="" /></li>
            </ul>
            <p class="sign-description" role="tooltip" hidden></p>
        </main>
    </div>
</body>
</html>
