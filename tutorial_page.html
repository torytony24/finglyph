<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js/mobile-access.js"></script>
    <title>Finglyph</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/tutorial_page.css" />
    <link rel="stylesheet" href="css/mobile-unsupported.css" />
</head>
<body>
    <div class="mobile-unsupported" role="main">
        <p>모바일은 지원하지 않습니다.<br />컴퓨터에서 이용해 주세요.</p>
    </div>
    <main class="practice-page" aria-label="Hand-sign practice">
        <section class="camera-module" aria-label="Hand recognition camera">
            <div class="camera-frame">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="hand-overlay" aria-hidden="true"></canvas>
                <p id="camera-status" aria-live="polite">Preparing the camera...</p>
            </div>
            <button id="camera-retry" type="button" hidden>Try camera again</button>
        </section>

        <section class="gesture-guide" aria-live="polite" aria-label="Current hand gesture guide">
            <div class="guide-sign"><img id="guide-image" src="assets/signs/A.svg" alt="" /></div>
            <div>
                <p>Make the <strong id="guide-letter">A</strong> hand sign and hold it briefly.</p>
                <div class="hold-track" aria-hidden="true"><span id="hold-progress"></span></div>
            </div>
        </section>

        <section id="found-gestures" aria-label="Recognized hand gestures"></section>
        <h1 class="tutorial-greeting" aria-hidden="true" aria-label="Hello, Finglyph!"><span class="tutorial-greeting__hello">Hello,</span><span class="tutorial-greeting__brand">Finglyph</span><span class="tutorial-greeting__mark">!</span></h1>
        <p class="tutorial-tagline" aria-hidden="true">Create a delightful experience with Finglyph.</p>
        <button class="tutorial-next-button tutorial-finale-start" type="button" aria-hidden="true" tabindex="-1">start &gt;</button>
        <footer class="tutorial-footer-preview" aria-hidden="true"><input class="tutorial-input-preview" type="text" value="hello finglyph" readonly tabindex="-1" aria-label="Preview text input" /></footer>
        <a class="skip-link" href="main_page.html">Skip<span aria-hidden="true">></span></a>
    </main>
    <div id="morph-staging" aria-hidden="true"></div>
    <script src="js/script.js"></script>
    <script type="module">
        if (!document.documentElement.classList.contains('is-mobile-device')) {
            import('./js/tutorial-page.js');
        }
    </script>
</body>
</html>
