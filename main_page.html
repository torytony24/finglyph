<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js/mobile-access.js"></script>
    <script src="js/nav-menu.js" async></script>
    <title>Finglyph</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css?v=postcard-debug-download-1" />
    <link rel="stylesheet" href="css/mobile-unsupported.css" />
</head>
<body>
    <div class="mobile-unsupported" role="main">
        <p>모바일은 지원하지 않습니다.<br />컴퓨터에서 이용해 주세요.</p>
    </div>
    <div class="container">
        <header class="top-fixed">
            <h1><a class="brand-link" href="main_page.html">Finglyph</a></h1>
            <div class="header-actions">
                <button class="download-button" type="button" aria-label="Preview postcard" aria-haspopup="dialog" aria-controls="postcard-preview-dialog" title="Preview postcard">
                    <img class="download-button-icon download-button-icon--white" src="assets/download/download_white.svg" width="18" height="18" alt="" aria-hidden="true" />
                    <img class="download-button-icon download-button-icon--black" src="assets/download/download_black.svg" width="18" height="18" alt="" aria-hidden="true" />
                </button>
                <nav class="top-right-buttons" aria-label="Main navigation">
                    <a class="nav-btn how-to-use" href="howtouse.html">How to use</a>
                    <a class="nav-btn behind" href="behind.html">Behind</a>
                    <a class="nav-btn description" href="description.html">Description</a>
                    <span class="nav-indicator" aria-hidden="true"></span>
                </nav>
            </div>
        </header>

        <main class="main-scrollable">
            <div id="output"></div>
        </main>

        <footer class="bottom-fixed">
            <input
                type="text"
                id="textInput"
                placeholder="Type anything..."
                autocomplete="off"
                spellcheck="false"
                autofocus
            />
        </footer>
    </div>

    <div id="morph-staging" aria-hidden="true"></div>

    <aside id="camera-panel" aria-live="polite">
        <div class="camera-preview">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="hand-overlay" aria-hidden="true"></canvas>
            <button id="camera-toggle" type="button" data-state="off" aria-label="Start camera" aria-pressed="false" title="Start camera">
                <svg class="camera-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M4 7.5h3l1.5-2h7l1.5 2h3A1.5 1.5 0 0 1 21.5 9v9A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18V9A1.5 1.5 0 0 1 4 7.5Z" />
                    <circle cx="12" cy="13.5" r="3.25" />
                </svg>
                <span id="camera-toggle-label" class="camera-toggle-label">Start camera</span>
                <span class="camera-toggle-indicator" aria-hidden="true"></span>
            </button>
        </div>
        <div class="camera-candidate is-empty">
            <span id="camera-glyph" class="glyph-slot camera-glyph" aria-hidden="true"></span>
            <div class="camera-candidate-copy">
                <strong id="camera-letter" aria-hidden="true"></strong>
                <span id="camera-status">Start camera to begin.</span>
                <div class="hold-track" aria-hidden="true">
                    <div id="hold-progress" class="hold-progress"></div>
                </div>
            </div>
        </div>
    </aside>

    <dialog id="postcard-preview-dialog" class="postcard-preview-dialog" aria-label="Postcard preview">
        <canvas id="postcard-preview-canvas" class="postcard-preview-canvas" width="1800" height="1200" role="img" aria-label="Blank white postcard"></canvas>
        <button id="postcard-debug-download" class="postcard-debug-download" type="button" disabled>Debug: download</button>
    </dialog>

    
    <script src="js/script.js"></script>
    <script src="js/postcard-preview.js?v=debug-download-1"></script>
    <script type="module" src="js/webcam-basic.js"></script>
    <script type="module" src="js/hand-recognition.js"></script>
</body>
</html>
